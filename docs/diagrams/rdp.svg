<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="380" y="20" text-anchor="middle" font-weight="bold" font-size="14">Step 2 — RDP simplify (ε ≈ 250 m)</text>

  <!-- LEFT: dense path -->
  <g transform="translate(20,40)">
    <text x="160" y="0" text-anchor="middle" font-weight="bold">Dense search output</text>
    <text x="160" y="18" text-anchor="middle" font-size="11" fill="#555">one point per Δt of expansion</text>

    <!-- zigzag dense polyline -->
    <polyline fill="none" stroke="#bbb" stroke-width="1.2"
      points="20,210 30,200 40,185 50,165 60,140 70,120 80,105 90,95 100,90
              110,95 120,110 130,130 140,155 150,180 160,195 170,200
              180,195 190,180 200,160 210,135 220,115 230,100 240,90 250,87
              260,90 270,105 280,125 290,150 300,170 310,180 320,185"/>
    <!-- dense dots -->
    <g fill="#999">
      <circle cx="20" cy="210" r="2"/>
      <circle cx="30" cy="200" r="2"/>
      <circle cx="40" cy="185" r="2"/>
      <circle cx="50" cy="165" r="2"/>
      <circle cx="60" cy="140" r="2"/>
      <circle cx="70" cy="120" r="2"/>
      <circle cx="80" cy="105" r="2"/>
      <circle cx="90" cy="95"  r="2"/>
      <circle cx="100" cy="90" r="2"/>
      <circle cx="110" cy="95" r="2"/>
      <circle cx="120" cy="110" r="2"/>
      <circle cx="130" cy="130" r="2"/>
      <circle cx="140" cy="155" r="2"/>
      <circle cx="150" cy="180" r="2"/>
      <circle cx="160" cy="195" r="2"/>
      <circle cx="170" cy="200" r="2"/>
      <circle cx="180" cy="195" r="2"/>
      <circle cx="190" cy="180" r="2"/>
      <circle cx="200" cy="160" r="2"/>
      <circle cx="210" cy="135" r="2"/>
      <circle cx="220" cy="115" r="2"/>
      <circle cx="230" cy="100" r="2"/>
      <circle cx="240" cy="90"  r="2"/>
      <circle cx="250" cy="87"  r="2"/>
      <circle cx="260" cy="90"  r="2"/>
      <circle cx="270" cy="105" r="2"/>
      <circle cx="280" cy="125" r="2"/>
      <circle cx="290" cy="150" r="2"/>
      <circle cx="300" cy="170" r="2"/>
      <circle cx="310" cy="180" r="2"/>
      <circle cx="320" cy="185" r="2"/>
    </g>
    <circle cx="20" cy="210" r="5" fill="#222"/>
    <text x="20" y="240" text-anchor="middle" font-size="11">start</text>
    <circle cx="320" cy="185" r="5" fill="#222"/>
    <text x="320" y="240" text-anchor="middle" font-size="11">destination</text>
  </g>

  <!-- arrow -->
  <line x1="360" y1="160" x2="420" y2="160" stroke="#333" marker-end="url(#arr)"/>
  <text x="390" y="148" text-anchor="middle" font-size="11">RDP</text>

  <!-- RIGHT: simplified path -->
  <g transform="translate(420,40)">
    <text x="160" y="0" text-anchor="middle" font-weight="bold">Emitted waypoints</text>
    <text x="160" y="18" text-anchor="middle" font-size="11" fill="#555">tack apexes only — straight segments between</text>

    <!-- straight segments between kept apexes (start, apex, valley, apex, end) -->
    <polyline fill="none" stroke="#1a73e8" stroke-width="2"
      points="20,210 100,90 170,200 250,87 320,185"/>

    <!-- kept apex dots -->
    <g fill="#1a73e8" stroke="#0b3d8c" stroke-width="1.5">
      <circle cx="20" cy="210" r="6"/>
      <circle cx="100" cy="90" r="6"/>
      <circle cx="170" cy="200" r="6"/>
      <circle cx="250" cy="87" r="6"/>
      <circle cx="320" cy="185" r="6"/>
    </g>
    <text x="20" y="240" text-anchor="middle" font-size="11">start</text>
    <text x="320" y="240" text-anchor="middle" font-size="11">destination</text>
    <text x="100" y="80" text-anchor="middle" font-size="10" fill="#555">apex</text>
    <text x="170" y="220" text-anchor="middle" font-size="10" fill="#555">apex</text>
    <text x="250" y="78" text-anchor="middle" font-size="10" fill="#555">apex</text>
  </g>
</svg>
