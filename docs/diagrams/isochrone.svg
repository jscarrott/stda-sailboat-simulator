<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <style>
    text { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      [fill="#fffbe6"] { fill: #3d2e0c; }
      [fill="#e6f4ff"] { fill: #1a2937; }
      [fill="#fff1e6"] { fill: #3d2716; }
      [fill="#e8f5e9"] { fill: #1c2e1e; }
      [stroke="#333"] { stroke: #e6edf3; }
      [fill="#333"] { fill: #e6edf3; }
      [fill="#222"] { fill: #e6edf3; }
      [fill="#555"] { fill: #adbac7; }
      [fill="#666"] { fill: #adbac7; }
      [fill="#888"] { fill: #8d96a0; }
      [stroke="#888"] { stroke: #8d96a0; }
      [fill="#999"] { fill: #8d96a0; }
      [fill="#bbb"] { fill: #6e7681; }
      [stroke="#bbb"] { stroke: #6e7681; }
      [stroke="#ddd"] { stroke: #484f58; }
      [fill="#996600"] { fill: #ffaa44; }
      [fill="#1a73e8"] { fill: #58a6ff; }
      [stroke="#1a73e8"] { stroke: #58a6ff; }
      [stroke="#0b3d8c"] { stroke: #79b8ff; }
      [fill="#cc3333"] { fill: #f85149; }
      [stroke="#cc3333"] { stroke: #f85149; }
      [fill="#cc6600"] { fill: #ff944d; }
      [stroke="#cc6600"] { stroke: #ff944d; }
      [fill="#2e7d32"] { fill: #56d364; }
      [stroke="#2e7d32"] { stroke: #56d364; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="410" y="20" text-anchor="middle" font-weight="bold" font-size="14">Step 1 — Isochrone search</text>

  <!-- LEFT PANEL: one node expanding -->
  <g transform="translate(40,50)">
    <text x="160" y="0" text-anchor="middle" font-weight="bold">Expand one frontier node</text>
    <text x="160" y="18" text-anchor="middle" font-size="11" fill="#555">one candidate per heading (n_head = 360/heading_step)</text>

    <!-- frontier node at center -->
    <circle cx="160" cy="170" r="8" fill="#1a73e8" stroke="#0b3d8c" stroke-width="1.5"/>
    <text x="160" y="195" text-anchor="middle" font-size="11">frontier node</text>

    <!-- candidate points around it -->
    <g fill="#888">
      <circle cx="260" cy="170" r="3"/>
      <circle cx="253" cy="139" r="3"/>
      <circle cx="234" cy="113" r="3"/>
      <circle cx="207" cy="96"  r="3"/>
      <circle cx="175" cy="91"  r="3"/>
      <circle cx="145" cy="91"  r="3"/>
      <circle cx="113" cy="96"  r="3"/>
      <circle cx="86"  cy="113" r="3"/>
      <circle cx="67"  cy="139" r="3"/>
      <circle cx="60"  cy="170" r="3"/>
      <circle cx="67"  cy="201" r="3"/>
      <circle cx="86"  cy="227" r="3"/>
      <circle cx="113" cy="244" r="3"/>
      <circle cx="145" cy="249" r="3"/>
      <circle cx="175" cy="249" r="3"/>
      <circle cx="207" cy="244" r="3"/>
      <circle cx="234" cy="227" r="3"/>
      <circle cx="253" cy="201" r="3"/>
    </g>
    <!-- some radial dashed lines -->
    <g stroke="#bbb" stroke-dasharray="2 3" fill="none">
      <line x1="160" y1="170" x2="260" y2="170"/>
      <line x1="160" y1="170" x2="207" y2="96"/>
      <line x1="160" y1="170" x2="113" y2="244"/>
      <line x1="160" y1="170" x2="60" y2="170"/>
    </g>

    <!-- in-no-go and land-hit markers -->
    <g>
      <circle cx="175" cy="91" r="3" fill="#cc3333"/>
      <circle cx="145" cy="91" r="3" fill="#cc3333"/>
      <text x="160" y="78" text-anchor="middle" font-size="10" fill="#cc3333">in-no-go (polar = 0)</text>
    </g>
    <text x="160" y="282" text-anchor="middle" font-size="10" fill="#555">tide drift adds to every candidate</text>
    <text x="160" y="295" text-anchor="middle" font-size="10" fill="#555">segments crossing land are dropped</text>
  </g>

  <!-- Arrow between panels -->
  <line x1="370" y1="200" x2="420" y2="200" stroke="#333" marker-end="url(#arr)"/>
  <text x="395" y="190" text-anchor="middle" font-size="11" fill="#333">prune</text>

  <!-- RIGHT PANEL: bucket pruning -->
  <g transform="translate(440,50)">
    <text x="170" y="0" text-anchor="middle" font-weight="bold">Prune by cross-track bucket</text>
    <text x="170" y="18" text-anchor="middle" font-size="11" fill="#555">keep the best along-axis point per bucket</text>

    <!-- start→dest axis -->
    <line x1="20" y1="280" x2="320" y2="280" stroke="#333" stroke-width="1"/>
    <circle cx="20" cy="280" r="5" fill="#333"/>
    <text x="20" y="300" text-anchor="middle" font-size="11">start</text>
    <text x="320" y="300" text-anchor="middle" font-size="11">→ dest (axis)</text>

    <!-- bucket separators (perpendicular dashed lines) -->
    <g stroke="#bbb" stroke-dasharray="3 3">
      <line x1="50"  y1="40" x2="50"  y2="270"/>
      <line x1="100" y1="40" x2="100" y2="270"/>
      <line x1="150" y1="40" x2="150" y2="270"/>
      <line x1="200" y1="40" x2="200" y2="270"/>
      <line x1="250" y1="40" x2="250" y2="270"/>
      <line x1="300" y1="40" x2="300" y2="270"/>
    </g>
    <text x="75"  y="35" text-anchor="middle" font-size="10" fill="#888">bucket</text>
    <text x="125" y="35" text-anchor="middle" font-size="10" fill="#888">bucket</text>
    <text x="175" y="35" text-anchor="middle" font-size="10" fill="#888">bucket</text>
    <text x="225" y="35" text-anchor="middle" font-size="10" fill="#888">bucket</text>
    <text x="275" y="35" text-anchor="middle" font-size="10" fill="#888">bucket</text>

    <!-- candidate points in each bucket; the "kept" one is highest (furthest along-axis is to the RIGHT) -->
    <!-- bucket 1 (50-100): candidates with various along-axis distances -->
    <circle cx="60"  cy="120" r="3" fill="#bbb"/>
    <circle cx="70"  cy="160" r="3" fill="#bbb"/>
    <circle cx="92"  cy="80"  r="5" fill="#1a73e8" stroke="#0b3d8c" stroke-width="1.5"/>

    <circle cx="110" cy="180" r="3" fill="#bbb"/>
    <circle cx="120" cy="100" r="3" fill="#bbb"/>
    <circle cx="143" cy="60"  r="5" fill="#1a73e8" stroke="#0b3d8c" stroke-width="1.5"/>

    <circle cx="160" cy="200" r="3" fill="#bbb"/>
    <circle cx="170" cy="140" r="3" fill="#bbb"/>
    <circle cx="192" cy="55"  r="5" fill="#1a73e8" stroke="#0b3d8c" stroke-width="1.5"/>

    <circle cx="210" cy="190" r="3" fill="#bbb"/>
    <circle cx="225" cy="120" r="3" fill="#bbb"/>
    <circle cx="240" cy="70"  r="5" fill="#1a73e8" stroke="#0b3d8c" stroke-width="1.5"/>

    <circle cx="260" cy="200" r="3" fill="#bbb"/>
    <circle cx="270" cy="150" r="3" fill="#bbb"/>
    <circle cx="290" cy="100" r="5" fill="#1a73e8" stroke="#0b3d8c" stroke-width="1.5"/>

    <!-- legend -->
    <circle cx="30" cy="240" r="5" fill="#1a73e8" stroke="#0b3d8c"/>
    <text x="40" y="244" font-size="11">kept (next frontier)</text>
    <circle cx="160" cy="240" r="3" fill="#bbb"/>
    <text x="170" y="244" font-size="11">dominated, dropped</text>
  </g>
</svg>
