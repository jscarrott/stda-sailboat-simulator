<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <text x="410" y="20" text-anchor="middle" font-weight="bold" font-size="14">Step 7 — Per-leg adaptive XTE lookahead</text>
  <text x="410" y="40" text-anchor="middle" font-size="12" fill="#555">
    eff = clamp(0.10 · leg_len, route.xte_lookahead, 3000 m)
  </text>

  <!-- LEFT PANEL: long leg -->
  <g transform="translate(20,80)">
    <text x="180" y="0" text-anchor="middle" font-weight="bold">Long leg (10 km) → loose lookahead</text>
    <text x="180" y="18" text-anchor="middle" font-size="11" fill="#555">eff = 1000 m, ~3° correction (boat foots for speed)</text>

    <!-- rhumb line -->
    <line x1="20" y1="180" x2="340" y2="180" stroke="#1a73e8" stroke-width="2"/>
    <circle cx="20" cy="180" r="6" fill="#1a73e8"/>
    <circle cx="340" cy="180" r="6" fill="#1a73e8"/>
    <text x="20" y="200" text-anchor="middle" font-size="11">leg start</text>
    <text x="340" y="200" text-anchor="middle" font-size="11">leg end</text>

    <!-- boat 50 m off (above) -->
    <g transform="translate(140,130)">
      <polygon points="0,-7 6,7 -6,7" fill="#222"/>
      <text x="-10" y="-2" text-anchor="end" font-size="11">boat</text>
    </g>
    <!-- XTE bracket -->
    <line x1="160" y1="180" x2="160" y2="135" stroke="#888" stroke-dasharray="3 2"/>
    <text x="170" y="160" font-size="11" fill="#888">XTE 50 m</text>

    <!-- gentle correction vector (~3° below horizontal) -->
    <line x1="140" y1="130" x2="320" y2="139" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrL)"/>
    <text x="230" y="121" text-anchor="middle" font-size="11" fill="#1a73e8">heading ≈ rhumb − 3°</text>
    <text x="230" y="155" text-anchor="middle" font-size="10" fill="#555">slow convergence; no pinching</text>
  </g>

  <!-- vertical separator -->
  <line x1="410" y1="80" x2="410" y2="340" stroke="#ddd"/>

  <!-- RIGHT PANEL: short leg -->
  <g transform="translate(440,80)">
    <text x="180" y="0" text-anchor="middle" font-weight="bold">Short approach leg (100 m) → tight lookahead</text>
    <text x="180" y="18" text-anchor="middle" font-size="11" fill="#555">eff = route.xte_lookahead (floor), ~73° correction (clears nearby land)</text>

    <!-- rhumb line -->
    <line x1="120" y1="180" x2="240" y2="180" stroke="#1a73e8" stroke-width="2"/>
    <circle cx="120" cy="180" r="6" fill="#1a73e8"/>
    <circle cx="240" cy="180" r="6" fill="#1a73e8"/>
    <text x="120" y="200" text-anchor="middle" font-size="11">leg start</text>
    <text x="240" y="200" text-anchor="middle" font-size="11">leg end</text>

    <!-- boat 50 m off (above) -->
    <g transform="translate(150,130)">
      <polygon points="0,-7 6,7 -6,7" fill="#222"/>
      <text x="-10" y="-2" text-anchor="end" font-size="11">boat</text>
    </g>
    <line x1="170" y1="180" x2="170" y2="135" stroke="#888" stroke-dasharray="3 2"/>
    <text x="180" y="160" font-size="11" fill="#888">XTE 50 m</text>

    <!-- sharp correction vector (~73° below horizontal) -->
    <line x1="150" y1="130" x2="200" y2="285" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrL)"/>
    <text x="60" y="240" font-size="11" fill="#1a73e8">heading ≈ rhumb − 73°</text>
    <text x="60" y="256" font-size="10" fill="#555">snaps back to the line;</text>
    <text x="60" y="270" font-size="10" fill="#555">avoids islets / shoreline</text>
  </g>
</svg>
