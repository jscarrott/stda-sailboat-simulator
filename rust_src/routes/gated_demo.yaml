name: gated_demo
acceptance_radius: 20.0
close_hauled_angle_deg: 45.0
xte_lookahead: 40.0
min_tack_duration_s: 30.0

# Demonstrates a tidal gate. Wind from the west (beam reach heading
# north). Two north legs; the waypoint between them is a tidal gate, so
# the boat loiters there until the tidal stream sets north (fair for the
# second leg) before proceeding. Run with a reversing N/S tide, e.g.
#   --tide-peak 0.6 --tide-flood-deg 0 --tide-period-h 2 --tide-phase-deg 200
# (phase 200° starts the stream foul/south so the gate actually holds).
wind:
  direction_deg: 0.0
  speed: 4.0

# Open the gate once the along-next-leg (north) current is >= 0.15 m/s.
gate_open_along_current: 0.15
# Forecast lead: open the gate this many seconds BEFORE the stream turns
# fair, so the boat is up to speed as the fair tide arrives (needs a
# forecastable current model — the analytic --tide-* stream or
# --tide-data). 0 = react to the present current. Try e.g. 1800.
gate_lead_time_s: 0.0
# Required fair-tide window: the forecast must stay fair for at least
# this long (from the lead-adjusted open time) before the gate opens, so
# the boat isn't released onto a leg the tide turns foul on mid-way.
# 0 = single-instant check. Also forecast-dependent. Try e.g. 1800.
gate_min_fair_window_s: 0.0

# A tidal gate on the FIRST waypoint gates departure: the boat holds at
# the start until the first leg's fair window opens. Add `gate: true` to
# waypoint 0 below to try it. (Station-keeping while holding only works
# while the boat can out-sail the stream; in a spring tide it drifts.)

waypoints:
  - { x: 0.0, y:    0.0 }
  - { x: 0.0, y:  500.0, gate: true }
  - { x: 0.0, y: 1000.0 }

loop: false
