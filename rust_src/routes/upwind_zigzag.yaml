name: upwind_zigzag
acceptance_radius: 5.0
close_hauled_angle_deg: 45.0
xte_lookahead: 15.0
min_tack_duration_s: 6.0   # long hold so a tack cycle is visible in the plot

# Math-coords direction the wind BLOWS TOWARD. 270° = -y = south,
# i.e. the wind comes from the north. The leg below runs due north,
# directly upwind — forcing the route follower to tack.
wind:
  direction_deg: 270.0
  speed: 5.0

waypoints:
  - { x: 0.0,  y: 0.0   }
  - { x: 0.0,  y: 200.0 }

loop: false
