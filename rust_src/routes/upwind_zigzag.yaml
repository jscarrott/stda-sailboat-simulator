name: upwind_zigzag
acceptance_radius: 5.0
close_hauled_angle_deg: 45.0
xte_lookahead: 15.0
min_tack_duration_s: 6.0   # longer hold so a tack cycle is visible in the plot

# Wind from due north; route runs directly upwind so tacking is forced.
wind:
  direction_deg: 90.0
  speed: 5.0

waypoints:
  - { x: 0.0,  y: 0.0   }
  - { x: 0.0,  y: 200.0 }

loop: false
