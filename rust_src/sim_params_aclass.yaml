## RC A-Class candidate for the Lundy passage (~2.2 m LOA, ~2.0 m LWL).
## Generated by `scripts/scale_hull.py --length 2.0 --mass 20
##                                     --roll-damping 0.7 --pitch-damping 0.7`.
##
## Mass: 20 kg — right in the real A-Class range (12–23 kg). Down from the
## previous 28 kg by retuning roll/pitch damping ratios from the reference's
## ζ=0.25 (light, underdamped) to ζ=0.7 (plausible for a deep bulb keel; well
## under critical so still a little overshoot). The bulb's viscous drag in
## water is what justifies the higher ζ — the 4 m reference's 0.25 is itself
## flagged as a "rough estimate" in the paper, so this is a sibling rough
## estimate appropriate to a fin/bulb hull. Empirically, ζ ≥ 0.7 is the floor
## that keeps a 20 kg hull numerically stable on this passage; below ~18 kg
## even ζ=2 doesn't help (a different stiffness, not roll oscillation).
##
## Deep high-AR fin keel (AR ~4.7) from scale_hull stands in for the bulb fin.
##
## controller_gains: computed via `scripts/compute_controller_gains.py
## sim_params_aclass.yaml` from yaw_timeconstant=3.54 with default Q/r —
## embedded for self-documentation and IOM parity. Regenerate after any
## yaw_timeconstant change.
