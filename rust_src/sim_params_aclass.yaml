  sail:
    pressure_point_height: 1.24
    height: 3.1
    area: 1.6
    length: 0.5
    stretching: 4.33333
  rudder:
    stretching: 4.33333
    area: 0.0325
  keel:
    height: 0.275
    length: 1
    stretching: 4.66667
  length: 2
  mass: 20
  height_bouyancy: 0.075
  lateral_area: 0.625
  waterline_area: 0.4
  wave_resistance_weight: 0.06
  distance_cog_sail_pressure_point: 0.215
  distance_cog_keel_pressure_point: 0.12
  distance_cog_rudder: 0.62
  distance_mast_sail_pressure_point: 0.34
  geometrical_moi_x: 0.016
  geometrical_moi_y: 1.6
  moi_x: 0.365714
  moi_y: 22.8571
  moi_z: 15.2286
  roll_damping: 0.7
  pitch_damping: 0.7
  damping_z: 0.2
  yaw_timeconstant: 3.53553
  along_damping: 10.6066
  transverse_damping: 3.53553
  hull_speed: 1.76777

environment:
  water_viscosity: 0.0000001
  air_viscosity: 0.0000171
  water_density: 1000
