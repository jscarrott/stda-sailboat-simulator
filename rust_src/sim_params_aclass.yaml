    vel_y: 0
    vel_z: 0
    yaw: 0
    pitch: 0
    roll: 0
    roll_rate: 0
    pitch_rate: 0
    yaw_rate: 0
    latitude: 51.207
    longitude: -4.110
    wind_strength: 5.0
    wind_direction: 45.0
    wave_direction: 220.0
    wave_length: 2.0
    wave_amplitude: 0.0
    sail_angle: 1
    rudder_angle: 1
controller_gains:
  kd: 0.8603564069876398
  ki: 0.09999999999999935
  kp: 0.5107500748440481
