## IOM (International One Metre) RC sailing yacht — sim parameters.
##
## Derived by consistent geometric scaling of the 4 m reference hull
## (sim_params_config.yaml) at length ratio λ = 0.25, with real IOM
## class values substituted where known (mass, A-rig sail area, draft,
## hull speed). Hand-tuned per-parameter guessing produced an
## internally-inconsistent, directionally-unstable boat that spun on
## every heading; scaling a hull that IS stable preserves the yaw
## balance that keeps it tracking.
##
## Scaling rules: lengths ×λ; areas ×λ²; mass ×λ³ (≈5.5 kg, but the
## real carbon IOM is the class-minimum 4 kg, used here); moments of
## inertia ×(mass_ratio·λ²); waterplane second moments ×λ⁴; times
## (yaw_timeconstant, damping) ×√λ; hull_speed ×√λ.
##
## Class rule reference: https://www.iomicra.com/class-rules
## Calibrate against scripts -> `--scenario polar`; target speeds
## (typical IOM): upwind ~1.0 m/s, reaching/running ~1.2-1.3 m/s.

boat: {
    sail: {
        pressure_point_height: 0.62,    # 2.48 ×λ
        height:                 1.55,   # 6.2 ×λ (A-rig mast above deck)
        area:                   0.60,   # CR: A-rig total sail area, m^2
        length:                 0.25,   # 1.0 ×λ (chord)
        stretching:             0.961   # dimensionless, kept from 4 m hull
    },

    rudder: {
        stretching: 2.326923076923077,  # dimensionless, kept
        area:       0.0081               # 0.13 ×λ^2
    },

    keel: {
        height:      0.1375,             # 0.55 ×λ
        length:      0.50,               # 2.0 ×λ
        stretching:  0.605               # dimensionless, kept
    },

    length:           1.0,               # CR: 1000 mm LOA
    mass:             4.0,               # CR: 4 kg class minimum
    height_bouyancy:  0.0375,            # 0.15 ×λ
    lateral_area:     0.156,             # 2.5 ×λ^2
    waterline_area:   0.10,              # 1.6 ×λ^2

    distance_cog_sail_pressure_point:  0.1075,  # 0.43 ×λ
    distance_cog_keel_pressure_point:  0.06,    # 0.24 ×λ
    distance_cog_rudder:               0.31,    # 1.24 ×λ
    distance_mast_sail_pressure_point: 0.17,    # 0.68 ×λ

    # moments of inertia ×(mass_ratio·λ^2) = (4/350)·0.0625 = 7.14e-4
    geometrical_moi_x: 0.00100,          # 0.256 ×λ^4
    geometrical_moi_y: 0.100,            # 25.6 ×λ^4
    moi_x: 0.0183,
    moi_y: 1.143,
    moi_z: 0.761,

    # ratios kept; times ×√λ = 0.5
    roll_damping:      0.25,
    pitch_damping:     0.25,
    damping_z:         0.20,
    yaw_timeconstant:  2.5,              # 5 ×√λ
    along_damping:     7.5,              # 15 ×√λ
    transverse_damping: 2.5,             # 5 ×√λ
    hull_speed:        1.25              # CR-ish: 1.34·√LWL_ft ≈ 1.25 m/s
}

environment: {
    water_viscosity: 0.0000001,
    air_viscosity:   0.0000171,
    water_density:        1000,
    air_density:           1.3,
    gravity:              9.81
}

# LQR gains for yaw_timeconstant=2.5, Python default weights
# Q=diag(0.1, 1.0, 0.3), r=30. Regenerate via:
#   poetry run python scripts/compute_controller_gains.py sim_params_iom.yaml
controller_gains:
  kp: 0.532997
  ki: 0.100000
  kd: 0.790563

simulator: {
    stepper: {
        stepsize:   0.1,
        clockrate:   10,
    },
    initial: {
        vel_x: 0,
        vel_y: 0,
        vel_z: 0,

        yaw:   0.5,
        pitch: 0,
        roll:  0,

        roll_rate:  0,
        pitch_rate: 0,
        yaw_rate:   0,

        latitude:     51.207,
        longitude:    -4.110,

        wind_strength:   3.0,
        wind_direction:  90.0,

        wave_direction: 0.0,
        wave_length:    0.5,
        wave_amplitude: 0.0,

        sail_angle:   0.0,
        rudder_angle: 0.0,
    }
}
