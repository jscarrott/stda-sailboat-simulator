# Standalone workspace: this crate is excluded from the host `sailboat_sim`
# workspace (it only builds for thumbv7em-none-eabihf), so it needs its own
# empty [workspace] table.
[workspace]

[package]
name = "nrf52840-fw"
version = "0.1.0"
edition = "2021"
description = "nRF52840 hardware-in-the-loop firmware: runs the boat-control heading + sail controller, talking to the host simulator over USB CDC-ACM"
license = "MIT"

[dependencies]
boat-control = { path = "../boat-control", default-features = false, features = ["libm"] }
# For f32 trig/sqrt in no_std (sqrt/atan2/signum on the sensor packet).
num-traits = { version = "0.2", default-features = false, features = ["libm"] }

embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "integrated-timers", "task-arena-size-8192"] }
embassy-nrf = { version = "0.2", features = ["nrf52840", "time-driver-rtc1", "gpiote", "time"] }
embassy-usb = { version = "0.3" }
embassy-futures = "0.1"
embassy-time = { version = "0.3" }

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
static_cell = "2"

defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

# Optional 128x64 SSD1306 I2C OLED status screen (rudder/sail + sensors).
embedded-graphics = { version = "0.8", optional = true }
ssd1306 = { version = "0.9", optional = true }
heapless = { version = "0.8", optional = true }

# Optional SX1262 LoRa supervisory link (position telemetry + waypoint commands).
lora-phy = { version = "3", optional = true }
embedded-hal-bus = { version = "0.2", features = ["async"], optional = true }
embedded-hal-async = { version = "1", optional = true }
embassy-sync = { version = "0.6", optional = true }

[features]
# Drive an SSD1306 OLED over I2C showing the live controller output and sensors.
display = ["dep:embedded-graphics", "dep:ssd1306", "dep:heapless"]
# Long-range supervisory link: report position and accept new waypoints over a
# Semtech SX1262 LoRa radio (SPI).
lora = ["dep:lora-phy", "dep:embedded-hal-bus", "dep:embedded-hal-async", "dep:embassy-sync"]
# Build this board as a LoRa<->USB bridge (shore station) instead of the boat
# controller: relays between USB serial and the LoRa air interface for the host
# `shore` tool. Implies `lora`.
bridge = ["lora"]

# Small, debuggable firmware: optimise so the USB stack fits comfortably and
# timing is realistic, but keep symbols for probe-rs/defmt.
[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
